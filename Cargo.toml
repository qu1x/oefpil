[package]
name = "oefpil"
version = "0.4.0"
rust-version = "1.85.0"
edition = "2024"
description = """Optimum Estimate of Function Parameters by Iterated Linearization (OEFPIL):
Algorithm for nonlinear function fitting to data with errors in both dependent and independent
variables where correlation, both within variables and among variables, might be present."""
documentation = "https://docs.rs/oefpil"
repository = "https://github.com/qu1x/oefpil"
authors = ["Rouven Spreckels <rs@qu1x.dev>"]
license = "MIT OR Apache-2.0"
keywords = [
	"function-fitting",
	"nonlinear-regression",
	"optimization-problem",
	"covariance-matrix",
	"error-propagation",
]
categories = [
	"algorithms",
	"mathematics",
	"science",
	"no-std",
]
include = [
	"src/**/*.rs",
	"examples/**/*.rs",
	"katex.html",
	"Cargo.toml",
	"README.md",
	"RELEASES.md",
	"LICENSE-*",
]

[package.metadata.docs.rs]
cargo-args = ["-Z", "unstable-options", "-Z", "rustdoc-scrape-examples"]
rustdoc-args = ["--cfg", "docsrs", "--html-in-header", "katex.html"]

[workspace]
members = ["oefpil-sys"]

[dependencies]
derive_more = { version = "2.0.1", default-features = false, features = ["display", "error", "from"] }
faer = { version = "0.24.4", default-features = false }
libm = "0.2.15"
special = "0.11.4"

[dev-dependencies]
oefpil-sys = { path = "oefpil-sys" }
rand = "0.9.1"
rand_chacha = "0.9.0"
rand_distr = "0.5.1"
const-hex = "1.14.1"

[lints.rust]
missing_docs = "forbid"

[lints.rustdoc]
broken_intra_doc_links = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

[profile.dev]
opt-level = 3

[profile.test]
opt-level = 3

[features]
default = ["std"]
std = ["faer/std"]

[[test]]
name = "regression"
required-features = ["std"]

[[example]]
name = "sine"
doc-scrape-examples = true
